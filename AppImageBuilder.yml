version: 1
script:
  - rm -rf AppDir | true
  - mkdir -p AppDir/usr/bin
  - cp *.py AppDir/usr/bin/
  - cp requirements.txt AppDir/
  - mkdir -p AppDir/usr/share/applications
  - cp longbookmerger.desktop AppDir/usr/share/applications/ || true
  - cp AppDir/usr/share/applications/longbookmerger.desktop AppDir/ || true
  - chmod +x AppDir/AppRun

AppDir:
  path: ./AppDir
  app_info:
    id: com.pnbtools.longbookmerger
    name: LongBookMerger
    icon: longbookmerger
    version: 1.1
    exec: AppRun
    exec_args: $@
  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-pip
      - python3-venv
      - libqt6widgets6
      - libqt6gui6
      - libqt6core6
      - libgl1
      - libglib2.0-0
      - libfontconfig1
  files:
    include:
      - /usr/bin/python3*
      - /usr/lib/python3*/**
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
  runtime:
    env:
      PYTHONHOME: "${APPDIR}/usr"
      PYTHONPATH: "${APPDIR}/usr/lib/python3.12:${APPDIR}/usr/lib/python3.12/lib-dynload:${APPDIR}/usr/bin"

AppImage:
  arch: x86_64
  update-information: guess
  sign-key: None
